name: Build APK

on:
  push:
    branches: [main, ccr-22f0ce33-7bglze]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Permisos del manifiesto final
        if: always()
        run: |
          f=$(find app/build -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
          echo "Manifiesto: $f"
          grep -hE "uses-permission|debuggable|allowBackup|exported" "$f" | sed 's/^ *//' | sort -u
      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug
      - name: Lint report
        if: always()
        run: cat app/build/reports/lint.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: PortaAlerta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
